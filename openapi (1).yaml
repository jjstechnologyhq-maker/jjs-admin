          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /support/tickets/{id}:
    get:
      tags: [Support]
      summary: Get ticket detail with full reply thread
      description: |
        Returns a single ticket including the complete `replies` array.
        **Roles**: SUPER_ADMIN, CUSTOMER_SUPPORT
      operationId: getTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket with replies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /support/tickets/{id}/replies:
    post:
      tags: [Support]
      summary: Append a reply to a ticket
      description: |
        Adds a reply from the acting admin to a ticket thread.
        Returns 409 if the ticket status is CLOSED (CLOSED is terminal — no replies allowed).
        **Roles**: SUPER_ADMIN, CUSTOMER_SUPPORT
      operationId: replyToTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyTicketRequest'
      responses:
        '201':
          description: Reply created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReplyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ticket is CLOSED — cannot reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /support/tickets/{id}/status:
    patch:
      tags: [Support]
      summary: Update ticket status
      description: |
        Transitions a ticket to a new status. Valid transitions:
        - OPEN → IN_PROGRESS, CLOSED
        - IN_PROGRESS → OPEN, CLOSED
        - CLOSED → *(terminal — no transitions allowed)*

        Returns 422 for invalid transition attempts.
        **Roles**: SUPER_ADMIN, CUSTOMER_SUPPORT
      operationId: updateTicketStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /support/notifications:
    post:
      tags: [Support]
      summary: Enqueue a push notification
      description: |
        Enqueues a push notification to be sent to the specified user.
        Returns 202 immediately with a `jobId` — delivery is asynchronous.
        **Roles**: SUPER_ADMIN, CUSTOMER_SUPPORT
      operationId: sendPushNotification
      requestBody:
        required: true
        content:
