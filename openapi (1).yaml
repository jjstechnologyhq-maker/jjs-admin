            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '202':
          description: Notification enqueued
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId:
                    type: string
                    description: Bull queue job ID for status tracking
              example:
                jobId: "42"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /support/banners:
    get:
      tags: [Support]
      summary: List active banners
      description: |
        Returns active banners served from Redis cache (5-minute TTL).
        **Roles**: SUPER_ADMIN, FINANCE_MANAGER, COMPLIANCE_OFFICER, CUSTOMER_SUPPORT
      operationId: listBanners
