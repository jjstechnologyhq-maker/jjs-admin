    # ── Analytics schemas ──────────────────────────────────────────────────────

    AnalyticsPeriodEnum:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY]

    ReportTypeEnum:
      type: string
      enum: [REVENUE, VOLUME, KYC, VASP]

    PdfReportStatusEnum:
      type: string
      enum: [QUEUED, PROCESSING, COMPLETE, FAILED]

    AnalyticsOverview:
      type: object
      required: [dataDate, dau, revenue, totalVolume]
      properties:
        dataDate:
          type: string
          format: date
          description: ISO-8601 date of the most recent aggregation
        dau:
          type: integer
          description: Daily active users
        revenue:
          type: string
          description: Serialised Decimal — total fee revenue for the day
          example: "48250.00"
        totalVolume:
          type: string
          description: Serialised Decimal — total transaction volume for the day
          example: "1250000.00"

    DataPoint:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          description: Count or amount depending on metric type
          oneOf:
            - type: integer
            - type: string

    VolumeDataPoint:
      type: object
      required: [date, swap, withdrawal, funding]
      properties:
        date:
          type: string
          format: date
        swap:
          type: string
          description: Serialised Decimal
        withdrawal:
          type: string
          description: Serialised Decimal
        funding:
          type: string
          description: Serialised Decimal

    RevenueDataPoint:
      type: object
      required: [date, total, byType]
      properties:
        date:
          type: string
          format: date
        total:
          type: string
          description: Serialised Decimal — sum across all transaction types
        byType:
          type: object
          additionalProperties:
            type: string
          description: Revenue broken down by transaction type key

    KycFunnelData:
      type: object
      required: [submitted, approved, rejected, pending, conversionRate]
      properties:
        submitted:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        pending:
          type: integer
        conversionRate:
          type: string
          description: Serialised Decimal — approved / submitted as a percentage string
          example: "72.50"

    VaspMonitoringData:
      type: object
      required: [dataDate, totalVolume, thresholdNgn, thresholdBreached, breakdown]
      properties:
        dataDate:
          type: string
          format: date
        totalVolume:
          type: string
          description: Serialised Decimal — total NGN-equivalent volume
        thresholdNgn:
          type: string
          description: Serialised Decimal — regulatory volume threshold in NGN
        thresholdBreached:
          type: boolean
          description: true when totalVolume >= thresholdNgn
        breakdown:
          type: object
          additionalProperties:
            type: string
          description: Per-asset volume breakdown (asset ticker → NGN-equivalent string)

    PdfReportStatusResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PdfReportStatusEnum'
        downloadUrl:
          type: string
          format: uri
          description: Pre-signed S3 URL valid for 15 minutes. Present only when status = COMPLETE. Do not cache.

    AuditLogEntry:
      type: object
      required: [id, adminId, action, entityType, entityId, ipAddress, metadata, createdAt]
      properties:
        id:
          type: string
          format: uuid
        adminId:
          type: string
          format: uuid
        action:
          type: string
          description: Machine-readable action string (e.g. UPDATE_USER_STATUS)
        entityType:
          type: string
          description: Entity being acted on (e.g. User, KycSubmission)
        entityId:
          type: ["string", "null"]
          description: ID of the entity being acted on
        ipAddress:
          type: string
        metadata:
          type: ["object", "null"]
          additionalProperties: true
          description: Additional context recorded at the time of the action
        createdAt:
          type: string
          format: date-time

    PaginatedAuditLog:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        meta:
          type: object
          required: [nextCursor, total, hasMore]
          properties:
            nextCursor:
              type: ["string", "null"]
            total:
              type: integer
            hasMore:
              type: boolean

    EnqueueReportRequest:
      type: object
      required: [reportType]
      properties:
        reportType:
          $ref: '#/components/schemas/ReportTypeEnum'
        filters:
          type: object
          additionalProperties: true
          description: |
            Optional filters — keys depend on reportType:
            - REVENUE/VOLUME: `period` (DAILY|WEEKLY|MONTHLY), `from` (ISO-8601), `to` (ISO-8601)
            - KYC: `status` (KYC status enum), `from`, `to`
            - VASP: no filters
