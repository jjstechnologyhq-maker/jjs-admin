        Returns today's DAU, revenue, and total volume from the latest analytics snapshots.
        **Roles**: All authenticated roles
      operationId: getAnalyticsOverview
      responses:
        '200':
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /analytics/users:
    get:
      tags: [Analytics]
      summary: DAU/WAU/MAU user metrics
      description: |
        Returns time-series user counts (DAU, WAU, or MAU) for a date range.
        Maximum date range: 366 days.
        **Roles**: All authenticated roles
      operationId: getUserMetrics
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AnalyticsPeriodEnum'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: ISO-8601 start of range (inclusive)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: ISO-8601 end of range (inclusive)
      responses:
        '200':
          description: User metric data points
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataPoint'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /analytics/volumes:
    get:
      tags: [Analytics]
      summary: Transaction volume metrics
      description: |
        Returns swap, withdrawal, and funding volumes broken down by period and date range.
        Maximum date range: 366 days.
        **Roles**: All authenticated roles
      operationId: getVolumeMetrics
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AnalyticsPeriodEnum'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Volume data points
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VolumeDataPoint'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /analytics/revenue:
    get:
      tags: [Analytics]
      summary: Fee revenue report
      description: |
        Returns fee revenue totals broken down by transaction type and period.
        Maximum date range: 366 days.
        **Roles**: All authenticated roles
      operationId: getRevenueReport
      parameters:
        - name: period
          in: query
          required: true
          schema:
