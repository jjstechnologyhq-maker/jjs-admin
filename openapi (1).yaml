          $ref: '#/components/schemas/RiskActionEnum'
        description:
          type: string
          maxLength: 500
        isDryRun:
          type: boolean

    ManualFlagRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    ManualUnflagRequest:
      type: object
      required: [justification]
      properties:
        justification:
