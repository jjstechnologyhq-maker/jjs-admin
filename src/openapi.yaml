openapi: 3.0.3
info:
  title: User Service API
  description: API for user authentication, profile management, KYC verification and admin operations
  version: 1.0.0
servers:
  - url: /api
    description: Current server

paths:

  # ── Authentication ──────────────────────────────────────────────────────────

  /user/signup:
    post:
      summary: Register a new user
      operationId: signup
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - phone
                - email
                - password
              properties:
                firstName:
                  type: string
                  description: User's first name
                middleName:
                  type: string
                  description: User's middle name (optional)
                lastName:
                  type: string
                  description: User's last name
                phone:
                  type: string
                  description: User's phone number (e.g. +2348012345678)
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: User's password (minimum 8 characters)
      responses:
        '200':
          description: Signup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/signin:
    post:
      summary: Authenticate a user
      description: >
        Log in with either email or phone alongside password.
        At least one of `email` or `phone` must be provided.
      operationId: signin
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address (required if phone is not provided)
                phone:
                  type: string
                  description: User's phone number (required if email is not provided)
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: User's password
      responses:
        '200':
          description: Signin successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/refresh:
    post:
      summary: Refresh access token
      description: >
        Exchange a valid refresh token for a new access token and refresh token pair.
        The old refresh token is invalidated immediately — store the new one.
      operationId: refreshToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: The refresh token returned by signin or a previous refresh call
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/reset_password:
    post:
      summary: Request a password reset email
      description: Sends a password reset link to the provided email address. Always returns 200 to avoid leaking whether an account exists.
      operationId: forgetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address associated with the account
      responses:
        '200':
          description: Password reset email sent (or silently ignored if email not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/reset_password/{token}:
    post:
      summary: Set a new password using a reset token
      description: The token is extracted from the reset link sent to the user's email. Tokens are single-use and expire.
      operationId: resetPassword
      tags:
        - Authentication
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Password reset token from the emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: New password (minimum 8 characters)
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Reset token has expired or already been used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/verify_phone:
    post:
      summary: Request a phone verification OTP
      description: Step 1 of phone verification. Sends a 6-digit OTP to the provided number.
      operationId: verifyRequest
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  description: Phone number to verify (e.g. +2348012345678)
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Confirm phone verification OTP
      description: Step 2 of phone verification. Submit the OTP received by SMS.
      operationId: verifyPhone
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  type: string
                  description: The phone number being verified
                otp:
                  type: string
                  description: 6-digit OTP received via SMS
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Phone verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: OTP is invalid or has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Profile ─────────────────────────────────────────────────────────────────

  /user/profile:
    get:
      summary: Get the logged-in user's profile
      operationId: getProfile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Update profile details
      description: Partial update — only send the fields you want to change. Fields not included are left unchanged.
      operationId: updateProfile
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  description: Updated first name
                middleName:
                  type: string
                  description: Updated middle name
                lastName:
                  type: string
                  description: Updated last name
                jjsTag:
                  type: string
                  description: Updated platform handle (jjsTag)
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/profile/image:
    patch:
      summary: Update profile picture
      description: Upload a new profile image. Send as multipart/form-data, not JSON.
      operationId: updateProfileImage
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Profile image file (JPEG or PNG recommended)
      responses:
        '200':
          description: Profile picture updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/profile/pin:
    patch:
      summary: Set or update the transaction PIN
      description: The PIN is a 4-digit number used to authorize transactions. Must be between 1000 and 9999.
      operationId: updatePin
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pin
              properties:
                pin:
                  type: integer
                  format: int32
                  description: 4-digit transaction PIN
                  minimum: 1000
                  maximum: 9999
      responses:
        '200':
          description: PIN updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── KYC ─────────────────────────────────────────────────────────────────────

  /user/kyc/bvn:
    post:
      summary: Submit BVN for identity verification
      description: >
        Submits the user's Bank Verification Number to the KYC provider.
        The user must explicitly confirm consent before this can be called.
        Verification is asynchronous — KYC level will not update immediately.
      operationId: verifyBvn
      tags:
        - KYC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - isSubjectConsent
              properties:
                id:
                  type: string
                  description: BVN number (11 digits)
                  minLength: 11
                  maxLength: 11
                  pattern: '^\d{11}$'
                isSubjectConsent:
                  type: boolean
                  description: Must be true. Confirms the user has explicitly consented to BVN verification.
      responses:
        '200':
          description: BVN submitted for verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/kyc/address:
    post:
      summary: Submit address for verification
      description: >
        Submits a residential address to the KYC provider for verification.
        The user must explicitly confirm consent before this can be called.
        Verification is asynchronous — KYC level will not update immediately.
      operationId: verifyAddress
      tags:
        - KYC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isSubjectConsent
                - address
              properties:
                isSubjectConsent:
                  type: boolean
                  description: Must be true. Confirms the user has explicitly consented to address verification.
                address:
                  type: object
                  required:
                    - buildingNumber
                    - landmark
                    - street
                    - state
                    - city
                  properties:
                    flatNumber:
                      type: string
                      description: Flat or apartment number (optional)
                    buildingName:
                      type: string
                      description: Name of the building (optional)
                    buildingNumber:
                      type: string
                      description: Building or house number (required)
                    landmark:
                      type: string
                      description: Nearby landmark (required)
                    street:
                      type: string
                      description: Street name (required)
                    subStreet:
                      type: string
                      description: Sub-street or off-street (optional)
                    state:
                      type: string
                      description: State (required)
                    city:
                      type: string
                      description: City (required)
                    lga:
                      type: string
                      description: Local government area (optional)
      responses:
        '200':
          description: Address submitted for verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    description: KYC provider response payload (structure depends on provider)
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/kyc/selfie:
    post:
      summary: Submit selfie for liveness verification
      description: >
        Uploads a selfie for liveness check against the BVN photo.
        Send as multipart/form-data, not JSON.
        The user must explicitly confirm consent before this can be called.
      operationId: verifySelfie
      tags:
        - KYC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
                - id
                - isSubjectConsent
              properties:
                image:
                  type: string
                  format: binary
                  description: Selfie image file
                id:
                  type: string
                  description: User ID reference
                isSubjectConsent:
                  type: boolean
                  description: Must be true. Confirms the user has explicitly consented to liveness verification.
      responses:
        '200':
          description: Selfie submitted for verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Admin ────────────────────────────────────────────────────────────────────

  /user/admin/users:
    get:
      summary: List all users (admin only)
      description: Returns a paginated list of all users. Requires admin role.
      operationId: getUsers
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search term — matches against name, email, phone, or jjsTag
          schema:
            type: string
        - name: sort
          in: query
          description: "Sort order. Valid values: createdAt:asc, createdAt:desc, lastName:asc, lastName:desc"
          schema:
            type: string
            enum:
              - createdAt:asc
              - createdAt:desc
              - lastName:asc
              - lastName:desc
        - name: status
          in: query
          description: Filter by account status
          schema:
            type: string
            enum:
              - active
              - suspended
              - unverified
              - pending kyc
              - flagged
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/admin/users/{id}:
    get:
      summary: Get a single user by ID (admin only)
      operationId: getUser
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The user's unique ID
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Update a user's account status (admin only)
      operationId: updateStatus
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The user's unique ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - suspended
                    - unverified
                    - pending kyc
                    - flagged
                  description: New account status
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/admin/stats:
    get:
      summary: Get platform statistics (admin only)
      operationId: getStats
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stats retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AdminStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ── Components ───────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Pass the accessToken returned by signin or signup.
        Format: Authorization: Bearer <token>

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: A resource with the given details already exists (e.g. email already registered)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request body is well-formed but contains invalid values
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    UserProfile:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - phone
        - kycLevel
        - role
        - status
        - createdAt
      properties:
        id:
          type: string
          description: Unique user ID
        email:
          type: string
          format: email
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
        phone:
          type: string
        kycLevel:
          type: string
          enum: ["0", "1", "2", "3"]
          description: >
            KYC verification level.
            0 = unverified, 1 = phone verified, 2 = BVN verified, 3 = fully verified
        role:
          type: string
          enum: [admin, subscriber]
        status:
          type: string
          enum: [active, suspended, unverified, pending kyc, flagged]
        pin:
          type: string
          nullable: true
          description: Whether a transaction PIN has been set (masked — actual value not returned)
        jjsTag:
          type: string
          nullable: true
          description: User's platform handle
        image:
          type: string
          format: uri
          nullable: true
          description: URL to the user's profile picture
        bvn:
          type: string
          nullable: true
          description: BVN on file (masked for security)
        youCandidateId:
          type: string
          nullable: true
          description: KYC provider candidate reference ID
        lastLogin:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the user's last login
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the account was created

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          required:
            - accessToken
            - refreshToken
          properties:
            accessToken:
              type: string
              description: Short-lived JWT for authenticating API requests
            refreshToken:
              type: string
              description: Long-lived token used to obtain a new access token via POST /user/refresh

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Human-readable error description
        error:
          type: string
          description: Error code or type (if provided by the server)

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total number of records matching the query
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Number of records per page
        totalPages:
          type: integer
          description: Total number of pages

    AdminStats:
      type: object
      description: Platform-wide user statistics
      properties:
        totalUsers:
          type: integer
          description: Total number of registered users
        activeUsers:
          type: integer
          description: Users with status active
        suspendedUsers:
          type: integer
          description: Users with status suspended
        flaggedUsers:
          type: integer
          description: Users with status flagged
        pendingKycUsers:
          type: integer
          description: Users with status pending kyc
        unverifiedUsers:
          type: integer
          description: Users with status unverified
        newUsersToday:
          type: integer
          description: Accounts created in the last 24 hours
        newUsersThisWeek:
          type: integer
          description: Accounts created in the last 7 days
        newUsersThisMonth:
          type: integer
          description: Accounts created in the last 30 days
